<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 506" style="max-width:748px" role="img" aria-labelledby="change-packets-1-title change-packets-1-desc"><title id="change-packets-1-title">Путь общей проблемы: проверенный запрос в sibling, issue с разрешения Owner, импорт и решение в Planveyor, новая версия и обновление проекта</title><desc id="change-packets-1-desc">Sibling: проверенный запрос → Owner разрешает отправить issue; Owner разрешает отправить issue → Planveyor: импорт запроса как PI; Planveyor: импорт запроса как PI → Architect самого Planveyor решает, нужен ли план; Architect самого Planveyor решает, нужен ли план → ACK: ссылка на решение (и на исполнение, если есть); ACK: ссылка на решение (и на исполнение, если есть) → Новая версия (с извещением, если меняется контракт) (изменение принято); Новая версия (с извещением, если меняется контракт) → Sibling: обновление и проверка исправления</desc><defs><marker id="change-packets-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M224,87.0 L282,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#change-packets-1-arrow)"/><path d="M466,87.0 L524,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#change-packets-1-arrow)"/><path d="M616.0,134 L616.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#change-packets-1-arrow)"/><path d="M524,253.0 L466,253.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#change-packets-1-arrow)"/><path d="M282,253.0 L224,253.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#change-packets-1-arrow)"/><rect x="183.4" y="241.0" width="139.2" height="24" rx="5" fill="#f5f6ef"/><text x="253.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#395749">изменение принято</text><path d="M132.0,300 L132.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#change-packets-1-arrow)"/><rect x="40" y="40" width="184" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="132.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Sibling:</text><text x="132.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">проверенный запрос</text><rect x="282" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Owner разрешает</text><text x="374.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">отправить issue</text><rect x="524" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Planveyor: импорт</text><text x="616.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">запроса как PI</text><rect x="524" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect самого</text><text x="616.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Planveyor решает,</text><text x="616.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">нужен ли план</text><rect x="282" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="227.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">ACK: ссылка на</text><text x="374.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">решение (и на</text><text x="374.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">исполнение, если</text><text x="374.0" y="290.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">есть)</text><rect x="40" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="132.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Новая версия (с</text><text x="132.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">извещением, если</text><text x="132.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">меняется контракт)</text><rect x="40" y="372" width="184" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="132.0" y="393.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Sibling:</text><text x="132.0" y="414.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">обновление и</text><text x="132.0" y="435.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">проверка</text><text x="132.0" y="456.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">исправления</text></svg>