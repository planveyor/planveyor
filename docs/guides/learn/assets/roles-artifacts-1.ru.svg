<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 340" style="max-width:748px" role="img" aria-labelledby="roles-artifacts-1-title roles-artifacts-1-desc"><title id="roles-artifacts-1-title">Owner передаёт цель Architect, дальше работа идёт через Planner, Coder и Reviewer и возвращается к Architect на приёмку</title><desc id="roles-artifacts-1-desc">Owner: цель и ответы → Architect: план и границы; Architect: план и границы → Planner: черновик кода и целевые файлы; Planner: черновик кода и целевые файлы → Coder: код и результаты проверок; Coder: код и результаты проверок → Reviewer: ревью двух линий; Reviewer: ревью двух линий → Architect: решение о приёмке</desc><defs><marker id="roles-artifacts-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M224,87.0 L282,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#roles-artifacts-1-arrow)"/><path d="M466,87.0 L524,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#roles-artifacts-1-arrow)"/><path d="M616.0,134 L616.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#roles-artifacts-1-arrow)"/><path d="M524,253.0 L466,253.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#roles-artifacts-1-arrow)"/><path d="M282,253.0 L224,253.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#roles-artifacts-1-arrow)"/><rect x="40" y="40" width="184" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="132.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Owner: цель и</text><text x="132.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">ответы</text><rect x="282" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect: план и</text><text x="374.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">границы</text><rect x="524" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="72.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Planner: черновик</text><text x="616.0" y="93.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">кода и целевые</text><text x="616.0" y="114.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">файлы</text><rect x="524" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Coder: код и</text><text x="616.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">результаты</text><text x="616.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">проверок</text><rect x="282" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Reviewer: ревью</text><text x="374.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">двух линий</text><rect x="40" y="206" width="184" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="132.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect: решение</text><text x="132.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">о приёмке</text></svg>