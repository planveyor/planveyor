<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 672" style="max-width:874px" role="img" aria-labelledby="work-contours-1-title work-contours-1-desc"><title id="work-contours-1-title">Три контура: после ревью и решения Architect разработку закрывают коммитом, анализ даёт решение о следующей работе, а зонтичный план декомпозиции паркуется, и работа идёт в дочерних планах</title><desc id="work-contours-1-desc">Цель Owner → Разработка: результат и границы понятны; Цель Owner → Анализ: сначала ответить на вопрос и сравнить варианты; Цель Owner → Декомпозиция: цель не умещается в один план; Разработка: результат и границы понятны → Ревью и решение Architect; Анализ: сначала ответить на вопрос и сравнить варианты → Ревью и решение Architect; Декомпозиция: цель не умещается в один план → Ревью и решение Architect; Ревью и решение Architect → Разработка: коммит и закрытие документов; Ревью и решение Architect → Анализ: коммит плана и решение о следующей работе; Ревью и решение Architect → Декомпозиция: зонтичный план паркуется, работа идёт в дочерних планах</desc><defs><marker id="work-contours-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M437.0,134 C437.0,170.0 153.0,170.0 153.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,134 C437.0,170.0 437.0,170.0 437.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,134 C437.0,170.0 721.0,170.0 721.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M153.0,300 C153.0,336.0 437.0,336.0 437.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,300 C437.0,336.0 437.0,336.0 437.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M721.0,300 C721.0,336.0 437.0,336.0 437.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,466 C437.0,502.0 153.0,502.0 153.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,466 C437.0,502.0 437.0,502.0 437.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,466 C437.0,502.0 721.0,502.0 721.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><rect x="324.0" y="40" width="226" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="437.0" y="93.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Цель Owner</text><rect x="40.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Разработка: результат и</text><text x="153.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">границы понятны</text><rect x="324.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Анализ: сначала</text><text x="437.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">ответить на вопрос и</text><text x="437.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">сравнить варианты</text><rect x="608.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="721.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Декомпозиция: цель не</text><text x="721.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">умещается в один план</text><rect x="324.0" y="372" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="414.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Ревью и решение</text><text x="437.0" y="435.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect</text><rect x="40.0" y="538" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="580.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Разработка: коммит и</text><text x="153.0" y="601.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">закрытие документов</text><rect x="324.0" y="538" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="570.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Анализ: коммит плана и</text><text x="437.0" y="591.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">решение о следующей</text><text x="437.0" y="612.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">работе</text><rect x="608.0" y="538" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="721.0" y="570.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Декомпозиция: зонтичный</text><text x="721.0" y="591.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">план паркуется, работа</text><text x="721.0" y="612.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">идёт в дочерних планах</text></svg>