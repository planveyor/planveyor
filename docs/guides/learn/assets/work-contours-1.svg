<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 672" style="max-width:874px" role="img" aria-labelledby="work-contours-1-title work-contours-1-desc"><title id="work-contours-1-title">Three contours: after the review and the decision of Architect, development is closed with a commit, analysis gives a decision about the next work, and the umbrella plan of a decomposition is parked, with the work going on in the child plans</title><desc id="work-contours-1-desc">Owner goal → Development: result and scope are clear; Owner goal → Analysis: first answer a question and compare options; Owner goal → Decomposition: goal does not fit in one plan; Development: result and scope are clear → Review and Architect decision; Analysis: first answer a question and compare options → Review and Architect decision; Decomposition: goal does not fit in one plan → Review and Architect decision; Review and Architect decision → Development: commit and docs closeout; Review and Architect decision → Analysis: plan commit, decision on the next work; Review and Architect decision → Decomposition: umbrella plan is parked, work goes on in child plans</desc><defs><marker id="work-contours-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M437.0,134 C437.0,170.0 153.0,170.0 153.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,134 C437.0,170.0 437.0,170.0 437.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,134 C437.0,170.0 721.0,170.0 721.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M153.0,300 C153.0,336.0 437.0,336.0 437.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,300 C437.0,336.0 437.0,336.0 437.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M721.0,300 C721.0,336.0 437.0,336.0 437.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,466 C437.0,502.0 153.0,502.0 153.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,466 C437.0,502.0 437.0,502.0 437.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><path d="M437.0,466 C437.0,502.0 721.0,502.0 721.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#work-contours-1-arrow)"/><rect x="324.0" y="40" width="226" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="437.0" y="93.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Owner goal</text><rect x="40.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Development: result and</text><text x="153.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">scope are clear</text><rect x="324.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Analysis: first answer</text><text x="437.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">a question and compare</text><text x="437.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">options</text><rect x="608.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="721.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Decomposition: goal</text><text x="721.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">does not fit in one</text><text x="721.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">plan</text><rect x="324.0" y="372" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="414.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Review and Architect</text><text x="437.0" y="435.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">decision</text><rect x="40.0" y="538" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="580.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Development: commit and</text><text x="153.0" y="601.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">docs closeout</text><rect x="324.0" y="538" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="570.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Analysis: plan commit,</text><text x="437.0" y="591.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">decision on the next</text><text x="437.0" y="612.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">work</text><rect x="608.0" y="538" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="721.0" y="570.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Decomposition: umbrella</text><text x="721.0" y="591.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">plan is parked, work</text><text x="721.0" y="612.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">goes on in child plans</text></svg>