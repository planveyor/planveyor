<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 838" style="max-width:590px" role="img" aria-labelledby="mechanics-1-title mechanics-1-desc"><title id="mechanics-1-title">A task goes through the plan, the work, the review, and the commit, then the docs closeout with records of process improvements and follow-ups. Separately come the triage of the proposals, a fix plan, and the post-merge check with the docs sweep and the archive; the next tasks get the rules and documents from them</title><desc id="mechanics-1-desc">Task: plan, work, review, and commit → Separately after the merge: docs sweep and archive; Task: plan, work, review, and commit → Docs closeout: results, PIs, and follow-ups; Docs closeout: results, PIs, and follow-ups → Separate PI triage: Architect and Owner decision; Separate PI triage: Architect and Owner decision → Ordinary fix plan with review and acceptance; Ordinary fix plan with review and acceptance → Rules and documents for the next tasks; Separately after the merge: docs sweep and archive → Rules and documents for the next tasks</desc><defs><marker id="mechanics-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M295.0,134 C295.0,170.0 153.0,170.0 153.0,206" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><path d="M295.0,134 C295.0,170.0 437.0,170.0 437.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#mechanics-1-arrow)"/><path d="M437.0,300 C437.0,336.0 295.0,336.0 295.0,372" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><path d="M295.0,466 C295.0,502.0 295.0,502.0 295.0,538" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><path d="M295.0,632 C295.0,668.0 295.0,668.0 295.0,704" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><path d="M153.0,300 L153.0,336.0 L12,336.0 L12,668.0 L295.0,668.0 L295.0,704" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><rect x="182.0" y="40" width="226" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="295.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Task: plan, work,</text><text x="295.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">review, and commit</text><rect x="40.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Separately after the</text><text x="153.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">merge: docs sweep and</text><text x="153.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">archive</text><rect x="324.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Docs closeout: results,</text><text x="437.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">PIs, and follow-ups</text><rect x="182.0" y="372" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="404.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Separate PI triage:</text><text x="295.0" y="425.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect and Owner</text><text x="295.0" y="446.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">decision</text><rect x="182.0" y="538" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="580.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Ordinary fix plan with</text><text x="295.0" y="601.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">review and acceptance</text><rect x="182.0" y="704" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="746.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Rules and documents for</text><text x="295.0" y="767.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">the next tasks</text></svg>