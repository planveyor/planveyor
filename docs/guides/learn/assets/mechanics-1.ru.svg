<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 838" style="max-width:590px" role="img" aria-labelledby="mechanics-1-title mechanics-1-desc"><title id="mechanics-1-title">Задача проходит план, работу, ревью и коммит, затем закрытие документов с записями предложений и отложенных задач. Отдельно идут разбор предложений, план исправления и проверка после слияния с обзором документов и архивом; от них правила и документы получают следующие задачи</title><desc id="mechanics-1-desc">Задача: план, работа, ревью и коммит → Отдельно после слияния: обзор документов и архив; Задача: план, работа, ревью и коммит → Закрытие документов: итоги, PI и отложенные задачи; Закрытие документов: итоги, PI и отложенные задачи → Отдельный разбор PI: Architect и решение Owner; Отдельный разбор PI: Architect и решение Owner → Обычный план исправления с ревью и приёмкой; Обычный план исправления с ревью и приёмкой → Правила и документы для следующих задач; Отдельно после слияния: обзор документов и архив → Правила и документы для следующих задач</desc><defs><marker id="mechanics-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M295.0,134 C295.0,170.0 153.0,170.0 153.0,206" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><path d="M295.0,134 C295.0,170.0 437.0,170.0 437.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#mechanics-1-arrow)"/><path d="M437.0,300 C437.0,336.0 295.0,336.0 295.0,372" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><path d="M295.0,466 C295.0,502.0 295.0,502.0 295.0,538" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><path d="M295.0,632 C295.0,668.0 295.0,668.0 295.0,704" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><path d="M153.0,300 L153.0,336.0 L12,336.0 L12,668.0 L295.0,668.0 L295.0,704" fill="none" stroke="#58766b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mechanics-1-arrow)"/><rect x="182.0" y="40" width="226" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="295.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Задача: план, работа,</text><text x="295.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">ревью и коммит</text><rect x="40.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Отдельно после слияния:</text><text x="153.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">обзор документов и</text><text x="153.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">архив</text><rect x="324.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Закрытие документов:</text><text x="437.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">итоги, PI и отложенные</text><text x="437.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">задачи</text><rect x="182.0" y="372" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="404.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Отдельный разбор PI:</text><text x="295.0" y="425.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect и решение</text><text x="295.0" y="446.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Owner</text><rect x="182.0" y="538" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="570.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Обычный план</text><text x="295.0" y="591.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">исправления с ревью и</text><text x="295.0" y="612.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">приёмкой</text><rect x="182.0" y="704" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="746.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Правила и документы для</text><text x="295.0" y="767.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">следующих задач</text></svg>