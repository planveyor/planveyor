<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 340" style="max-width:748px" role="img" aria-labelledby="testing-evidence-1-title testing-evidence-1-desc"><title id="testing-evidence-1-title">Требование превращается в проверку: вход теста с ожиданием, проверка, наблюдаемый результат и решение по ревью</title><desc id="testing-evidence-1-desc">Требование → Фикстура и ожидание; Фикстура и ожидание → Проверка; Проверка → Наблюдаемый результат; Наблюдаемый результат → Ревью и решение</desc><defs><marker id="testing-evidence-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M224,87.0 L282,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#testing-evidence-1-arrow)"/><path d="M466,87.0 L524,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#testing-evidence-1-arrow)"/><path d="M616.0,134 L616.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#testing-evidence-1-arrow)"/><path d="M524,253.0 L466,253.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#testing-evidence-1-arrow)"/><rect x="40" y="40" width="184" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="132.0" y="93.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Требование</text><rect x="282" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Фикстура и</text><text x="374.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">ожидание</text><rect x="524" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="93.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Проверка</text><rect x="524" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Наблюдаемый</text><text x="616.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">результат</text><rect x="282" y="206" width="184" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Ревью и решение</text></svg>