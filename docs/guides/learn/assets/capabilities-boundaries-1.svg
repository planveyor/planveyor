<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 506" style="max-width:590px" role="img" aria-labelledby="capabilities-boundaries-1-title capabilities-boundaries-1-desc"><title id="capabilities-boundaries-1-title">Механизм реализован, его поведение покрыто проверкой, результат принят в задаче; открытые обязательства записаны отдельно</title><desc id="capabilities-boundaries-1-desc">Механизм описан и реализован → Поведение покрыто конкретной проверкой; Поведение покрыто конкретной проверкой → Результат принят для конкретной задачи; Механизм описан и реализован → Открытые обязательства первого релиза</desc><defs><marker id="capabilities-boundaries-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M295.0,134 C295.0,170.0 153.0,170.0 153.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#capabilities-boundaries-1-arrow)"/><path d="M153.0,300 C153.0,336.0 295.0,336.0 295.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#capabilities-boundaries-1-arrow)"/><path d="M295.0,134 C295.0,170.0 437.0,170.0 437.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#capabilities-boundaries-1-arrow)"/><rect x="182.0" y="40" width="226" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="295.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Механизм описан и</text><text x="295.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">реализован</text><rect x="40.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Поведение покрыто</text><text x="153.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">конкретной проверкой</text><rect x="182.0" y="372" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="414.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Результат принят для</text><text x="295.0" y="435.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">конкретной задачи</text><rect x="324.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Открытые обязательства</text><text x="437.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">первого релиза</text></svg>