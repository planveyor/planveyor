<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 340" style="max-width:748px" role="img" aria-labelledby="sibling-lifecycle-1-title sibling-lifecycle-1-desc"><title id="sibling-lifecycle-1-title">Как появляется sibling: выбор движка и каталога, init, план адаптации, работа ролей, ревью и закрытие документов</title><desc id="sibling-lifecycle-1-desc">Owner выбирает движок и каталог проекта → sibling init: контракт и первый коммит; sibling init: контракт и первый коммит → План адаптации и анкета стека; План адаптации и анкета стека → Роли настраивают и проверяют стек; Роли настраивают и проверяют стек → Ревью, приёмка и закрытие документов</desc><defs><marker id="sibling-lifecycle-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M224,87.0 L282,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-1-arrow)"/><path d="M466,87.0 L524,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-1-arrow)"/><path d="M616.0,134 L616.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-1-arrow)"/><path d="M524,253.0 L466,253.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-1-arrow)"/><rect x="40" y="40" width="184" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="132.0" y="72.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Owner выбирает</text><text x="132.0" y="93.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">движок и каталог</text><text x="132.0" y="114.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">проекта</text><rect x="282" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="72.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">sibling init:</text><text x="374.0" y="93.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">контракт и первый</text><text x="374.0" y="114.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">коммит</text><rect x="524" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">План адаптации и</text><text x="616.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">анкета стека</text><rect x="524" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Роли настраивают и</text><text x="616.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">проверяют стек</text><rect x="282" y="206" width="184" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Ревью, приёмка и</text><text x="374.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">закрытие</text><text x="374.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">документов</text></svg>