<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 1004" style="max-width:590px" role="img" aria-labelledby="sibling-lifecycle-2-title sibling-lifecycle-2-desc"><title id="sibling-lifecycle-2-title">How the upgrade goes: checks, the candidate, the upgrade plan before the directory swap, then the work of the roles and docs closeout</title><desc id="sibling-lifecycle-2-desc">Owner chose a new engine version → Project and notice checks; Project and notice checks → Upgrade candidate: Copier and checks; Upgrade candidate: Copier and checks → Resolution, review, commit in candidate, then --accept-candidate (conflict); Resolution, review, commit in candidate, then --accept-candidate → Upgrade candidate: Copier and checks (without Copier); Upgrade candidate: Copier and checks → Upgrade plan in the candidate (checks passed); Upgrade plan in the candidate → Backup and directory swap; Backup and directory swap → Roles, review, acceptance, and docs closeout</desc><defs><marker id="sibling-lifecycle-2-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M295.0,134 C295.0,170.0 295.0,170.0 295.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-2-arrow)"/><path d="M295.0,300 C295.0,336.0 295.0,336.0 295.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-2-arrow)"/><path d="M295.0,466 C295.0,502.0 153.0,502.0 153.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-2-arrow)"/><rect x="188.6" y="490.0" width="70.8" height="24" rx="5" fill="#f5f6ef"/><text x="224.0" y="506.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#395749">conflict</text><path d="M40.0,585.0 C12,585.0 12,419.0 182.0,419.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-2-arrow)"/><rect x="52.800000000000004" y="490.0" width="116.39999999999999" height="24" rx="5" fill="#f5f6ef"/><text x="111.0" y="506.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#395749">without Copier</text><path d="M295.0,466 C295.0,502.0 437.0,502.0 437.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-2-arrow)"/><rect x="311.6" y="490.0" width="108.8" height="24" rx="5" fill="#f5f6ef"/><text x="366.0" y="506.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#395749">checks passed</text><path d="M437.0,632 C437.0,668.0 295.0,668.0 295.0,704" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-2-arrow)"/><path d="M295.0,798 C295.0,834.0 295.0,834.0 295.0,870" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#sibling-lifecycle-2-arrow)"/><rect x="182.0" y="40" width="226" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="295.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Owner chose a new</text><text x="295.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">engine version</text><rect x="182.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Project and notice</text><text x="295.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">checks</text><rect x="182.0" y="372" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="414.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Upgrade candidate:</text><text x="295.0" y="435.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Copier and checks</text><rect x="40.0" y="538" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="570.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Resolution, review,</text><text x="153.0" y="591.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">commit in candidate,</text><text x="153.0" y="612.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">then --accept-candidate</text><rect x="324.0" y="538" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="580.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Upgrade plan in the</text><text x="437.0" y="601.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">candidate</text><rect x="182.0" y="704" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="746.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Backup and directory</text><text x="295.0" y="767.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">swap</text><rect x="182.0" y="870" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="902.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Roles, review,</text><text x="295.0" y="923.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">acceptance, and docs</text><text x="295.0" y="944.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">closeout</text></svg>