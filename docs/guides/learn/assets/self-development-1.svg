<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 340" style="max-width:748px" role="img" aria-labelledby="self-development-1-title self-development-1-desc"><title id="self-development-1-title">A Planveyor change goes through Architect, Planner, Coder, and Reviewer; the contract notice for siblings is part of the change itself; at the end, the commit and the closeout</title><desc id="self-development-1-desc">Shared process problem → Architect: rule and acceptance; Architect: rule and acceptance → Planner: exact files and check method; Planner: exact files and check method → Coder: change, tests, and notice; Coder: change, tests, and notice → Reviewer and Architect: accept the result; Reviewer and Architect: accept the result → Commit and closeout</desc><defs><marker id="self-development-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M224,87.0 L282,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#self-development-1-arrow)"/><path d="M466,87.0 L524,87.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#self-development-1-arrow)"/><path d="M616.0,134 L616.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#self-development-1-arrow)"/><path d="M524,253.0 L466,253.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#self-development-1-arrow)"/><path d="M282,253.0 L224,253.0" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#self-development-1-arrow)"/><rect x="40" y="40" width="184" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="132.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Shared process</text><text x="132.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">problem</text><rect x="282" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect: rule</text><text x="374.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">and acceptance</text><rect x="524" y="40" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="72.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Planner: exact</text><text x="616.0" y="93.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">files and check</text><text x="616.0" y="114.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">method</text><rect x="524" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="616.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Coder: change,</text><text x="616.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">tests, and notice</text><rect x="282" y="206" width="184" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="374.0" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Reviewer and</text><text x="374.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect: accept</text><text x="374.0" y="280.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">the result</text><rect x="40" y="206" width="184" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="132.0" y="248.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Commit and</text><text x="132.0" y="269.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">closeout</text></svg>