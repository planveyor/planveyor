<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 1004" style="max-width:590px" role="img" aria-labelledby="review-acceptance-1-title review-acceptance-1-desc"><title id="review-acceptance-1-title">Линия рисков, скрипт выбора, линия контракта и приёмка Architect; что происходит при каждом ответе скрипта</title><desc id="review-acceptance-1-desc">Coder: изменения и проверки → Reviewer, линия рисков; Reviewer, линия рисков → Скрипт выбора: можно ли опереться на запись линии рисков; Скрипт выбора: можно ли опереться на запись линии рисков → Reviewer, линия контракта: итог ревью (selected); Скрипт выбора: можно ли опереться на запись линии рисков → Линия рисков пишет новую запись (missing или blocked); Reviewer, линия контракта: итог ревью → Architect: приёмка; Architect: приёмка → Коммит изменённых файлов набора (Вердикт: принято.); Architect: приёмка → Возврат роли, которая должна исправить (Нужны исправления)</desc><defs><marker id="review-acceptance-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#58766b"/></marker></defs><path d="M295.0,134 C295.0,170.0 295.0,170.0 295.0,206" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#review-acceptance-1-arrow)"/><path d="M295.0,300 C295.0,336.0 295.0,336.0 295.0,372" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#review-acceptance-1-arrow)"/><path d="M295.0,466 C295.0,502.0 153.0,502.0 153.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#review-acceptance-1-arrow)"/><rect x="188.6" y="490.0" width="70.8" height="24" rx="5" fill="#f5f6ef"/><text x="224.0" y="506.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#395749">selected</text><path d="M295.0,466 C295.0,502.0 437.0,502.0 437.0,538" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#review-acceptance-1-arrow)"/><rect x="288.8" y="490.0" width="154.4" height="24" rx="5" fill="#f5f6ef"/><text x="366.0" y="506.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#395749">missing или blocked</text><path d="M153.0,632 C153.0,668.0 295.0,668.0 295.0,704" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#review-acceptance-1-arrow)"/><path d="M295.0,798 C295.0,834.0 153.0,834.0 153.0,870" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#review-acceptance-1-arrow)"/><rect x="154.4" y="822.0" width="139.2" height="24" rx="5" fill="#f5f6ef"/><text x="224.0" y="838.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#395749">Вердикт: принято.</text><path d="M295.0,798 C295.0,834.0 437.0,834.0 437.0,870" fill="none" stroke="#58766b" stroke-width="2" marker-end="url(#review-acceptance-1-arrow)"/><rect x="296.4" y="822.0" width="139.2" height="24" rx="5" fill="#f5f6ef"/><text x="366.0" y="838.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#395749">Нужны исправления</text><rect x="182.0" y="40" width="226" height="94" rx="10" fill="#1b302b" stroke="#1b302b" stroke-width="1.5"/><text x="295.0" y="82.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">Coder: изменения и</text><text x="295.0" y="103.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#f8fbf4">проверки</text><rect x="182.0" y="206" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="259.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Reviewer, линия рисков</text><rect x="182.0" y="372" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="404.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Скрипт выбора: можно ли</text><text x="295.0" y="425.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">опереться на запись</text><text x="295.0" y="446.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">линии рисков</text><rect x="40.0" y="538" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="580.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Reviewer, линия</text><text x="153.0" y="601.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">контракта: итог ревью</text><rect x="324.0" y="538" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="580.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Линия рисков пишет</text><text x="437.0" y="601.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">новую запись</text><rect x="182.0" y="704" width="226" height="94" rx="10" fill="#fbfcf7" stroke="#668074" stroke-width="1.5"/><text x="295.0" y="757.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Architect: приёмка</text><rect x="40.0" y="870" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="153.0" y="912.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Коммит изменённых</text><text x="153.0" y="933.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">файлов набора</text><rect x="324.0" y="870" width="226" height="94" rx="10" fill="#e8efea" stroke="#668074" stroke-width="1.5"/><text x="437.0" y="912.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">Возврат роли, которая</text><text x="437.0" y="933.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1b302b">должна исправить</text></svg>