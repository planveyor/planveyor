name: Planveyor checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shard-matrix:
    runs-on: macos-latest
    timeout-minutes: 105
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: My Planveyor
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Generate test matrix from manifest
        id: matrix
        working-directory: My Planveyor
        shell: bash
        run: |
          set -euo pipefail
          planveyor_test_matrix="$(python -B scripts/run_test_shard.py --matrix)"
          echo "matrix=$planveyor_test_matrix" >> "$GITHUB_OUTPUT"
  verify:
    needs: shard-matrix
    runs-on: macos-latest
    timeout-minutes: 105
    defaults:
      run:
        working-directory: My Planveyor
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shard-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: My Planveyor
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: My Planveyor/requirements-dev.lock
      - name: Install shell tools
        run: |
          brew install ripgrep
          command -v rg
          command -v zsh
          zsh -df -c 'exit 0'
      - name: Select build interpreter
        run: echo "PYBIN=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install development dependencies
        run: make bootstrap-python
      - name: Check test shard partition
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: '"$PYBIN" -B scripts/run_test_shard.py --matrix > "$RUNNER_TEMP/shard-matrix-readback.json"'
      - name: Lint documentation and translation pairs
        if: matrix.meta
        run: bash scripts/run_doc_lint.sh --i18n-strict
      - name: Lint changed plans
        if: matrix.meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          BEFORE_COMMIT: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            planveyor_ci_base="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
          else
            planveyor_ci_base="$BEFORE_COMMIT"
          fi
          if [[ -z "$planveyor_ci_base" || "$planveyor_ci_base" =~ ^0+$ ]] || ! git cat-file -e "$planveyor_ci_base^{commit}" 2>/dev/null; then
            planveyor_ci_base="$(git rev-list --max-parents=0 HEAD)"
          fi
          "$PYBIN" -B scripts/plan_lint_changed.py --base "$planveyor_ci_base" --head HEAD
      - name: Typecheck
        if: matrix.meta
        run: make typecheck
      - name: Scan public contents
        if: matrix.meta
        run: make oss-release-scan
      - name: Test workflow shard
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: '"$PYBIN" -B scripts/run_test_shard.py --shard "${{ matrix.shard }}" --report "$RUNNER_TEMP/test-shard.json"'
